services:
  data-ape-ng:
    hostname: data-ape-ng
    container_name: data-ape-ng
    image: da-server-ng:1.0.0-SNAPSHOT
    restart: always
    environment:
      TZ: America/New_York
      JAVA_TOOL_OPTIONS: "-Dda.mongo.allowed.hosts=mongo-db:27017 -Ddataape.write.enabled=true -Ddataape.write.origin=http://ape.lan.isoplane.com -Ddataape.delete.mode=archive-first"
    volumes:
      - /mnt/Pool_A/smbshare/docker/data-ape:/docker-data/data-ape:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - alphatrade_net

networks:
  alphatrade_net:
    external: true
